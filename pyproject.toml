[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "good"
version = "2.0.0"
description = "Grid Optimized Operation Dispatch: an economic dispatch and capacity expansion model for zonal power systems"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Aaron Rabinowitz" },
    { name = "Hanif Tayarani" },
    { name = "Jiwei Li" },
    { name = "Alan Jenn" },
]
requires-python = ">=3.10"
dependencies = [
    "highspy>=1.7",
    "linopy>=0.5",
    "networkx>=3.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.5",
    "scipy>=1.10",
    "xarray>=2023.6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
docs = ["mkdocs>=1.5,<2", "mkdocs-material>=9.5"]
dev = ["pytest>=7", "matplotlib>=3.7", "mkdocs>=1.5,<2", "mkdocs-material>=9.5"]

[project.urls]
Documentation = "https://github.com/ucdavis/good_model/tree/HEAD/docs"
Source = "https://github.com/ucdavis/good_model"

[tool.setuptools.packages.find]
include = ["good*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs the California example (a few seconds)",
]
